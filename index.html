<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#DDEFF6">
<meta name="description" content="BaJuca: quebra-cuca com Juma e Bart. Puzzles de raciocínio para crianças.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BaJuca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}*,*::before,*::after{box-sizing:inherit}body{margin:0;font-size:14px;overscroll-behavior:none}</style>
<title>BaJuca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: app de uma tela para celular — início (Juma e Bart + cartões dos modos) e jogo (regras, placar, tabuleiro, controles). Visual único e claro: céu, terra, caramelo da Juma e creme do Bart. */
:root{
  --sky:#DDEFF6;
  --sky-deep:#B9DDEB;
  --card:#FFFFFF;
  --ink:#22304A;
  --ink-soft:#5A6A82;
  --caramel:#D98A3D;
  --caramel-deep:#9A5320;
  --wood:#8A5A2B;
  --soil:#F3E7D6;
  --cream:#FFF7EA;
  --grass:#5DB24E;
  --juma:#D9447F;
  --bart:#2F86BC;
  --line:rgba(34,48,74,.14);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:700;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--caramel-deep);outline-offset:2px}
.app{height:100%;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column;min-height:0}

/* ---------- BOTÕES ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;padding:14px 18px;font-size:18px;font-weight:900;background:var(--card);box-shadow:0 4px 0 var(--sky-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-deep)}
.btn.primary{background:var(--caramel);color:#fff;box-shadow:0 4px 0 var(--caramel-deep);font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.5px}
.btn.primary:active{box-shadow:0 1px 0 var(--caramel-deep)}
.btn.soft{background:var(--sky)}
.btn small{display:block;font-family:var(--body);font-size:12px;font-weight:800;opacity:.85;letter-spacing:0}
.btn .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-align:left}

/* ---------- INÍCIO ---------- */
.home{align-items:center;justify-content:safe center;gap:12px;text-align:center;position:relative;overflow-y:auto}
.home h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,12vw,54px);line-height:.95;margin:0;letter-spacing:.5px;text-wrap:balance}
.home h1 .j{color:var(--juma)}.home h1 .b{color:var(--bart)}.home h1 .c{color:var(--caramel)}
.home h1 small{display:block;font-family:var(--body);font-weight:900;font-size:15px;letter-spacing:.5px;color:var(--ink-soft);margin-top:6px}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:0}
.duo figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.duo svg{width:min(23vw,96px);aspect-ratio:1;max-width:100%;transform-origin:50% 90%;animation:nod 4.4s ease-in-out infinite}
.duo figure:nth-child(2) svg{animation-delay:-2.2s}
.duo figcaption{font-family:var(--display);font-size:16px;letter-spacing:.5px;background:var(--card);border-radius:999px;padding:2px 12px;box-shadow:0 2px 0 var(--sky-deep)}
.duo figure:first-child figcaption{color:var(--juma)}
.duo figure:nth-child(2) figcaption{color:var(--bart)}
.duo.sm svg{width:96px}
@keyframes nod{0%,55%,100%{transform:rotate(0) translateY(0)}62%{transform:rotate(-8deg) translateY(-4px)}70%{transform:rotate(6deg)}78%{transform:rotate(0)}}
.mods{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px}
.mod{background:var(--card);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 4px 0 var(--sky-deep);text-align:left}
.modhead{display:flex;gap:12px;align-items:center}
.modhead svg{width:48px;height:48px;flex:none}
.modhead h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;line-height:1}
.modhead p{margin:3px 0 0;font-size:13px;line-height:1.3;color:var(--ink-soft)}
.modbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modbtns .btn{padding:10px 12px;justify-content:flex-start;font-size:15px;min-width:0}
.modbtns .btn.primary{font-size:19px}
.done{color:#2F8A3B}
.meta{display:flex;gap:18px;justify-content:center;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink)}
.grass{position:fixed;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom,0px));background:var(--grass);border-radius:50% 50% 0 0/22px 22px 0 0;z-index:-1;opacity:.35}

/* ---------- JOGO ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:10px}
.topbar .grp{display:flex;gap:8px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);display:grid;place-items:center;box-shadow:0 3px 0 var(--sky-deep);flex:none;font-family:var(--display);font-size:22px}
.iconbtn svg{width:22px;height:22px}
.lvl{text-align:center;min-width:0}
.lvl b{display:block;font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.lvl span{font-size:12px;color:var(--ink-soft)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.rule{background:var(--card);border-radius:12px;padding:7px 6px;font-size:12px;line-height:1.15;text-align:center;color:var(--caramel-deep);display:flex;align-items:center;justify-content:center;min-height:38px}
.stats{display:flex;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:16px;font-weight:900}
.pill svg{width:26px;height:26px}
.bones{display:flex;gap:2px}
.bones svg{width:30px;height:18px}
.bones .used{opacity:.22}
.boardwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{--n:6;--cell:40px;position:relative;width:min(100%,58vh,440px);aspect-ratio:1;max-width:100%;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);border:3px solid var(--ink);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--ink);box-shadow:0 5px 0 rgba(34,48,74,.25)}
.cell{position:relative;display:grid;place-items:center;box-sizing:border-box;border:0 solid rgba(34,48,74,.18);border-right-width:1px;border-bottom-width:1px}
.cell svg{pointer-events:none}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes hop{to{transform:translateY(-14%)}}

/* Canteiros */
.cell.bt{border-top:2.5px solid var(--ink)}
.cell.bl{border-left:2.5px solid var(--ink)}
.cell.br{border-right:2.5px solid var(--ink)}
.cell.bb{border-bottom:2.5px solid var(--ink)}
.cell .paw{width:30%;height:30%;color:rgba(34,48,74,.38)}
.cell .dog{width:84%;height:84%;animation:pop .22s cubic-bezier(.3,1.6,.6,1)}
.cell.bad::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(229,72,77,.55) 0 5px,transparent 5px 10px)}
.cell.bad .dog{animation:shake .35s}
.cell.hinted::after{content:"";position:absolute;inset:3px;border-radius:8px;box-shadow:inset 0 0 0 3px #fff;animation:flash 1.2s ease-out}
.board.won .cell .dog{animation:hop .6s ease-in-out infinite alternate;animation-delay:calc(var(--i) * 80ms)}

/* Labirinto */
.board.maze{background:#D4EDC6;border-color:#2F6E3B}
.board.maze>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.mdog{transition:transform .09s linear}
.mdog .ring{fill:rgba(255,255,255,.55);stroke:#fff;stroke-width:.06;opacity:0;transition:opacity .15s}
.mdog.active .ring{opacity:1}
.tgt{transform-box:fill-box;transform-origin:center;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.board.maze.won .dg,.board.maze.won .tgt{transform-box:fill-box;transform-origin:center bottom;animation:hop .5s ease-in-out infinite alternate}
.hintline{transition:opacity .4s}

/* Cercadinhos */
.board.shik{background:var(--soil)}
.board.shik .cell{background:var(--soil);border-color:rgba(138,90,43,.22)}
.layer,.tags{position:absolute;inset:0;pointer-events:none}
.pen{position:absolute;box-sizing:border-box;border-radius:9px}
.pen.ok{border:3px solid var(--wood);box-shadow:inset 0 0 0 2px rgba(255,255,255,.45);animation:penIn .2s ease-out}
.pen.bad{background:rgba(34,48,74,.16);border:2.5px dashed rgba(34,48,74,.55)}
.pen .area{position:absolute;left:4px;top:2px;font-family:var(--display);font-size:calc(var(--cell) * .26);color:var(--ink-soft)}
.pen.hinted::after{content:"";position:absolute;inset:-3px;border-radius:9px;box-shadow:0 0 0 4px #fff;animation:flash 1.2s ease-out}
@keyframes penIn{from{transform:scale(.94);opacity:.4}}
.preview{position:absolute;box-sizing:border-box;border:3px solid var(--caramel);background:rgba(217,138,61,.22);border-radius:9px;display:grid;place-items:center}
.preview.fit{border-color:#2F8A3B;background:rgba(93,178,78,.25)}
.preview span{font-family:var(--display);font-size:calc(var(--cell) * .5);color:var(--caramel-deep);background:rgba(255,255,255,.8);border-radius:999px;padding:0 .35em;line-height:1.15}
.preview.fit span{color:#2F8A3B}
.tag{position:absolute;display:grid;place-items:center}
.tag .num{width:64%;aspect-ratio:1;border-radius:50%;background:var(--cream);border:2.5px solid var(--caramel-deep);display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--cell) * .4);line-height:1;color:var(--ink);box-sizing:border-box}
.tag .dog{display:none;width:80%;height:80%}
.tag.ok .dog{display:block;animation:pop .22s cubic-bezier(.3,1.6,.6,1)}
.tag.ok .num{position:absolute;right:2%;bottom:2%;width:44%;font-size:calc(var(--cell) * .24);border-width:2px}
.board.won .tag .dog{animation:hop .6s ease-in-out infinite alternate;animation-delay:calc(var(--i) * 70ms)}

.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px}
.controls .btn{font-size:15px;padding:11px 8px;gap:6px}
.controls .btn svg{width:22px;height:22px;flex:none}
.controls .btn:disabled{opacity:.45}
.tip{text-align:center;font-size:12px;color:var(--ink-soft);padding-top:8px;text-wrap:balance}

/* ---------- SOBREPOSIÇÕES ---------- */
.overlay{position:fixed;inset:0;background:rgba(34,48,74,.55);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--card);border-radius:24px;padding:22px 20px;width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;gap:14px;animation:rise .3s cubic-bezier(.3,1.4,.6,1);max-height:100%;overflow:auto;box-sizing:border-box}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:32px;margin:0;line-height:1}
.sheet p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.4}

.rating{display:flex;justify-content:center;gap:6px}
.rating svg{width:40px;height:40px;color:var(--caramel)}
.rating .off{color:var(--sky-deep)}
.result{display:flex;justify-content:center;gap:24px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-soft)}
.result b{display:block;font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink)}
.howto{text-align:left;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.35}
.howto div{display:flex;gap:12px;align-items:center}
.howto svg{width:36px;height:36px;flex:none}
.howto .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;font-family:var(--display);font-size:20px;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;animation:fade .2s;max-width:calc(100% - 40px);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:680px){.rules{display:none}.home{gap:10px}.duo svg{width:min(22vw,84px)}.home h1{font-size:32px}}
</style>
</head>

<script>
(function(){
"use strict";
function $(id){return document.getElementById(id)}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function todayKey(){var d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}

var PALETTE=["#FFB4A2","#FFD66B","#A6E3A0","#8FCBF2","#C7B3F2","#F7A8D3","#86D9C6","#B9C5D9"];

/* =====================================================================
   GERADOR 1 — Canteiros (1 por cor, linha e coluna, sem encostar)

function permNoTouch(n,r){var p=[],used=new Array(n).fill(false);

  bt(0);return p}
function growRegions(n,sol,r){var g=new Array(n*n).fill(-1),w=[];for(var i=0;i<n;i++){g[i*n+sol[i]]=i;w.push(0.05+r()*r())}
  var left=n*n-n,D=[[1,0],[-1,0],[0,1],[0,-1]];
  while(left>0){var cand=[],tot=0;
    for(var k=0;k<n;k++){var fr=[];for(var idx=0;idx<n*n;idx++){if(g[idx]!==k)continue;var y=idx/n|0,x=idx%n;for(var d=0;d<4;d++){var yy=y+D[d][0],xx=x+D[d][1];if(yy<0||xx<0||yy>=n||xx>=n)continue;if(g[yy*n+xx]===-1)fr.push(yy*n+xx)}}
      if(fr.length){cand.push([k,fr]);tot+=w[k]}}
    var t=r()*tot,pick=cand[cand.length-1];for(var c=0;c<cand.length;c++){t-=w[cand[c][0]];if(t<=0){pick=cand[c];break}}
    g[pick[1][Math.floor(r()*pick[1].length)]]=pick[0];left--}
  return g}
function countStar(n,g,limit){var cnt=0,uc=new Array(n).fill(false),ur=new Array(n).fill(false);
  function bt(row,prev){if(cnt>=limit)return;if(row===n){cnt++;return}
    for(var c=0;c<n;c++){if(uc[c])continue;if(row>0&&Math.abs(c-prev)<2)continue;var k=g[row*n+c];if(ur[k])continue;uc[c]=ur[k]=true;bt(row+1,c);uc[c]=ur[k]=false}}
  bt(0,-9);return cnt}
function generateStar(n,seed){var r=mulberry32(seed),last=null;for(var a=0;a<3000;a++){var sol=permNoTouch(n,r),g=growRegions(n,sol,r);last={regions:g,sol:sol};if(countStar(n,g,2)===1)return last}return last}

/* =====================================================================
   GERADOR 2 — Cercadinhos (Shikaku: retângulo com a área do número)
   ===================================================================== */
function partitionRects(n,maxA,r){var g=new Array(n*n).fill(-1),rects=[];
  for(var i=0;i<n*n;i++){if(g[i]!==-1)continue;var y=i/n|0,x=i%n,opts=[],tot=0;
    for(var h=1;y+h<=n;h++){for(var w=1;x+w<=n;w++){var a=w*h;if(a>maxA)break;var ok=true;
        for(var yy=y;yy<y+h&&ok;yy++)for(var xx=x;xx<x+w;xx++)if(g[yy*n+xx]!==-1){ok=false;break}
        if(!ok)break;var wt=a===1?0.08:((w===1||h===1)&&a>4?0.6:1);opts.push([w,h,wt]);tot+=wt}}
    var t=r()*tot,p=opts[opts.length-1];for(var o=0;o<opts.length;o++){t-=opts[o][2];if(t<=0){p=opts[o];break}}
    var id=rects.length;rects.push({x:x,y:y,w:p[0],h:p[1]});
    for(var y2=y;y2<y+p[1];y2++)for(var x2=x;x2<x+p[0];x2++)g[y2*n+x2]=id}
  return rects}
function countShik(n,clues,limit){var at=new Array(n*n).fill(-1);clues.forEach(function(c,k){at[c.i]=k});
  var byTL=[];for(var q=0;q<n*n;q++)byTL.push([]);
  clues.forEach(function(c,k){var cy=c.i/n|0,cx=c.i%n;for(var h=1;h<=c.v;h++){if(c.v%h)continue;var w=c.v/h;
    for(var y=cy-h+1;y<=cy;y++)for(var x=cx-w+1;x<=cx;x++){if(y<0||x<0||y+h>n||x+w>n)continue;var ok=true;
      for(var yy=y;yy<y+h&&ok;yy++)for(var xx=x;xx<x+w;xx++){var a=at[yy*n+xx];if(a!==-1&&a!==k){ok=false;break}}
      if(ok)byTL[y*n+x].push({k:k,x:x,y:y,w:w,h:h})}}});
  var occ=new Uint8Array(n*n),used=new Uint8Array(clues.length),cnt=0;
  function fill(c,v){for(var yy=c.y;yy<c.y+c.h;yy++)for(var xx=c.x;xx<c.x+c.w;xx++)occ[yy*n+xx]=v}
  function free(c){for(var yy=c.y;yy<c.y+c.h;yy++)for(var xx=c.x;xx<c.x+c.w;xx++)if(occ[yy*n+xx])return false;return true}
  function bt(p){if(cnt>=limit)return;while(p<n*n&&occ[p])p++;if(p===n*n){cnt++;return}
    var L=byTL[p];for(var j=0;j<L.length;j++){var c=L[j];if(used[c.k]||!free(c))continue;used[c.k]=1;fill(c,1);bt(p+1);used[c.k]=0;fill(c,0)}}
  bt(0);return cnt}
function generateShik(n,seed){var r=mulberry32(seed),maxA=n<=5?6:n===6?8:n===7?10:12,last=null;
  for(var a=0;a<500;a++){var rects=partitionRects(n,maxA,r);
    for(var b=0;b<6;b++){var clues=rects.map(function(q){return{i:(q.y+Math.floor(r()*q.h))*n+q.x+Math.floor(r()*q.w),v:q.w*q.h}});
      last={rects:rects,clues:clues};if(countShik(n,clues,2)===1)return last}}
  return last}
function colorRects(n,rects,seed){var owner=new Array(n*n).fill(-1);rects.forEach(function(q,k){for(var y=q.y;y<q.y+q.h;y++)for(var x=q.x;x<q.x+q.w;x++)owner[y*n+x]=k});
  var adj=rects.map(function(){return new Set()});
  for(var i=0;i<n*n;i++){var y=i/n|0,x=i%n;if(x<n-1&&owner[i]!==owner[i+1]){adj[owner[i]].add(owner[i+1]);adj[owner[i+1]].add(owner[i])}
    if(y<n-1&&owner[i]!==owner[i+n]){adj[owner[i]].add(owner[i+n]);adj[owner[i+n]].add(owner[i])}}
  var pal=shuffle(PALETTE.slice(0,7),mulberry32(seed^0x2c1b3c6d)),col=[];
  rects.forEach(function(q,k){var taken={};adj[k].forEach(function(o){if(col[o])taken[col[o]]=1});var c=pal[k%pal.length];
    for(var j=0;j<pal.length;j++){var cand=pal[(k+j)%pal.length];if(!taken[cand]){c=cand;break}}col[k]=c});
  return col}

/* =====================================================================
   PERSISTÊNCIA (por modo)
   ===================================================================== */
var KEY="quintal-caramelo-v2",KEY_OLD="quintal-caramelo-v1";
function blankMode(){return{level:1,done:{},daily:{}}}
function freshStore(){return{sound:true,how:{},m:{canteiros:blankMode(),cercadinhos:blankMode(),labirinto:blankMode()},current:{}}}
var store=null;
try{store=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
if(!store||!store.m){store=freshStore();
  try{var o=JSON.parse(localStorage.getItem(KEY_OLD)||"null");
    if(o){store.m.canteiros={level:o.level||1,done:o.done||{},daily:o.daily||{}};store.sound=o.sound!==false;store.how.canteiros=!!o.seenHow;
      if(o.current&&o.current.cells)store.current.canteiros={key:o.current.key,state:{cells:o.current.cells},hints:o.current.hints||0,elapsed:o.current.elapsed||0}}}catch(e){}}
function ensureModes(){["canteiros","cercadinhos","labirinto"].forEach(function(g){if(!store.m[g])store.m[g]=blankMode()});if(!store.how)store.how={};if(!store.current)store.current={}}
ensureModes();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function streak(){var d=new Date(),n=0;function has(k){return Object.keys(store.m).some(function(g){return store.m[g].daily[k]})}
  if(!has(todayKey()))d.setDate(d.getDate()-1);
  while(true){var k=d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();if(has(k)){n++;d.setDate(d.getDate()-1)}else break}return n}
function pawsTotal(){var t=0;Object.keys(store.m).forEach(function(g){var m=store.m[g];for(var a in m.done)t+=m.done[a].paws||0;for(var b in m.daily)t+=m.daily[b].paws||0});return t}

/* =====================================================================
   SOM
   ===================================================================== */
var actx=null;
function tone(freq,dur,type,vol,when){if(!store.sound)return;try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();var t=actx.currentTime+(when||0),o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*1.5,t+dur);g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(kind){if(kind==="dog")tone(520,.09,"triangle",.14);else if(kind==="mark")tone(300,.04,"sine",.06);else if(kind==="pen")tone(390,.08,"triangle",.12);else if(kind==="bad")tone(180,.15,"square",.05);else if(kind==="win"){[523,659,784,1047].forEach(function(f,i){tone(f,.18,"triangle",.13,i*.11)})}}

/* =====================================================================
   ESTADO COMUM
   ===================================================================== */
var board=$("board"),G=null,D=null;
function clone(){return JSON.parse(JSON.stringify(G.state))}
function eng(){return ENG[G.game]}
function sizeFor(level){return level<=3?5:level<=10?6:level<=25?7:8}

/* =====================================================================
   MODO 1 — CANTEIROS
   ===================================================================== */
var ENG={};
ENG.canteiros={
  name:"Canteiros",
  desc:"Um cachorro em cada cor, sem ninguém se encostar.",
  rules:["1 cachorro por cor","1 por linha e coluna","Ninguém encosta em ninguém"],
  tip:"Toque 1× marca uma patinha · 2× coloca um cachorro · arraste para marcar vários",
  how:'<div><span class="ico" style="background:#7FC8F0">1</span><span>Cada <b>cor</b> é um canteiro do quintal e recebe exatamente <b>um cachorro</b>: a Juma ou o Bart.</span></div>'+
      '<div><span class="ico" style="background:#F2A36B">2</span><span>Só pode ter <b>um cachorro por linha</b> e <b>um por coluna</b>.</span></div>'+
      '<div><span class="ico" style="background:#A88FE0">3</span><span>Cachorros <b>não se encostam</b>, nem na diagonal.</span></div>'+
      '<div><svg viewBox="0 0 100 100" style="color:#8A97AB"><use href="#paw"/></svg><span>Toque uma vez para deixar uma <b>patinha</b> onde você sabe que não vai cachorro. Toque de novo para colocar o cachorro.</span></div>'+
      '<div><svg viewBox="0 0 100 60"><use href="#bone"/></svg><span>Travou? Gaste um <b>ossinho</b> e a Juma fareja um lugar certo. Sem dicas você ganha 3 patinhas.</span></div>',
  dailySize:8,seed:function(mode,level){return mode==="daily"?todayKey()*31+7:level*7919+13},
  create:function(n,seed){var p=generateStar(n,seed);p.colors=shuffle(PALETTE.slice(),mulberry32(seed^0x5bd1e995));return p},
  empty:function(n){return{cells:new Array(n*n).fill(0)}},
  isEmpty:function(){return G.state.cells.every(function(v){return v===0})},
  build:function(){var n=G.n,p=G.p;board.className="board";board.innerHTML="";
    for(var i=0;i<n*n;i++){var y=i/n|0,x=i%n,k=p.regions[i],el=document.createElement("div");el.className="cell";el.setAttribute("role","gridcell");el.style.background=p.colors[k];
      if(y>0&&p.regions[i-n]!==k)el.classList.add("bt");if(x>0&&p.regions[i-1]!==k)el.classList.add("bl");
      if(x<n-1&&p.regions[i+1]!==k)el.classList.add("br");if(y<n-1&&p.regions[i+n]!==k)el.classList.add("bb");
      if(x===n-1)el.style.borderRightWidth="0";if(y===n-1)el.style.borderBottomWidth="0";board.appendChild(el)}},
  conflicts:function(){var n=G.n,c=G.state.cells,R=G.p.regions,bad=new Set(),dogs=[];for(var i=0;i<n*n;i++)if(c[i]===2)dogs.push(i);
    for(var a=0;a<dogs.length;a++)for(var b=a+1;b<dogs.length;b++){var p=dogs[a],q=dogs[b],py=p/n|0,px=p%n,qy=q/n|0,qx=q%n;
      if(py===qy||px===qx||R[p]===R[q]||(Math.abs(py-qy)<=1&&Math.abs(px-qx)<=1)){bad.add(p);bad.add(q)}}
    return{bad:bad,dogs:dogs.length}},
  render:function(){var c=this.conflicts(),kids=board.children,di=0,cells=G.state.cells;
    for(var i=0;i<kids.length;i++){var el=kids[i],v=cells[i],want=v===2?"dog":v===1?"paw":"";
      if(el.dataset.v!==want){el.dataset.v=want;el.innerHTML=v===2?'<svg class="dog" viewBox="0 0 100 100"><use href="#'+(G.p.regions[i]%2?"bart":"juma")+'"/></svg>':v===1?'<svg class="paw" viewBox="0 0 100 100"><use href="#paw"/></svg>':""}
      el.classList.toggle("bad",c.bad.has(i));if(v===2)el.style.setProperty("--i",di++)}
    return{label:c.dogs+"/"+G.n,bad:c.bad.size,won:c.dogs===G.n&&c.bad.size===0}},
  down:function(i){D={start:i,last:i,moved:false,mode:null,before:clone()}},
  paint:function(i){var c=G.state.cells;if(D.mode==="mark"&&c[i]===0){c[i]=1;sfx("mark")}else if(D.mode==="erase"&&c[i]===1)c[i]=0},
  move:function(i){if(i===D.last)return;if(!D.moved){D.moved=true;var v=G.state.cells[D.start];D.mode=v===0?"mark":v===1?"erase":null;this.paint(D.start)}
    D.last=i;this.paint(i);render()},
  up:function(){var d=D;D=null;if(!d.moved){var c=G.state.cells;c[d.start]=(c[d.start]+1)%3;sfx(c[d.start]===2?"dog":c[d.start]===1?"mark":"")}commit(d.before)},
  hint:function(){var n=G.n,c=G.state.cells,sol=G.p.sol;
    for(var i=0;i<n*n;i++)if(c[i]===2&&sol[i/n|0]!==i%n){G.undo.push(clone());c[i]=0;toast("Esse cachorro estava no lugar errado. O Bart tirou ele de lá.");return function(){flashCell(i)}}
    for(var y=0;y<n;y++){var j=y*n+sol[y];if(c[j]!==2){G.undo.push(clone());c[j]=2;sfx("dog");return function(){flashCell(j)}}}
    return null}
};
function flashCell(i){var el=board.children[i];if(!el)return;el.classList.remove("hinted");void el.offsetWidth;el.classList.add("hinted")}

/* =====================================================================
   MODO 2 — CERCADINHOS
   ===================================================================== */
function pct(v){return(v/G.n*100)+"%"}
function placeBox(el,r,inset){el.style.left="calc("+pct(r.x)+" + "+inset+"px)";el.style.top="calc("+pct(r.y)+" + "+inset+"px)";
  el.style.width="calc("+pct(r.w)+" - "+(inset*2)+"px)";el.style.height="calc("+pct(r.h)+" - "+(inset*2)+"px)"}

ENG.cercadinhos={
  name:"Cercadinhos",
  desc:"Cerque cada cachorro com o número exato de casas.",

var MZ_E=2,MZ_S=4,MZ_D=[[0,-1,1,4],[1,0,2,8],[0,1,4,1],[-1,0,8,2]]; // dx, dy, bit, bit oposto (N,L,S,O)

  while(extra>0&&tries++<200){var c2=Math.floor(r()*n*n),d2=Math.floor(r()*4),x2=c2%n+MZ_D[d2][0],y2=(c2/n|0)+MZ_D[d2][1];
    if(x2<0||y2<0||x2>=n||y2>=n||(open[c2]&MZ_D[d2][2]))continue;open[c2]|=MZ_D[d2][2];open[y2*n+x2]|=MZ_D[d2][3];extra--}
  return open}

  for(var h=0;h<q.length;h++){var c=q[h],x=c%n,y=c/n|0;for(var d=0;d<4;d++){if(!(open[c]&MZ_D[d][2]))continue;var j=(y+MZ_D[d][1])*n+x+MZ_D[d][0];if(dist[j]<0){dist[j]=dist[c]+1;prev[j]=c;q.push(j)}}}

  else if(cx<0||cy<0||cx>=G.n||cy>=G.n)return -1;
  return cy*G.n+cx}

  else{if(better(m.done[G.level]))m.done[G.level]=rec;if(m.level<=G.level)m.level=G.level+1}

  setTimeout(function(){
    $("winTitle").textContent=G.mode==="daily"?"Desafio vencido!":G.game==="cercadinhos"?"Todo mundo cercado!":G.game==="labirinto"?(G.p.kind==="both"?"Hora de brincar!":"Encontrou!"):"Todo mundo no lugar!";
    $("winTime").textContent=fmt(G.elapsed);$("winHints").textContent=G.hints;
    var r=$("rating");r.innerHTML="";for(var i=0;i<3;i++)r.insertAdjacentHTML("beforeend",'<svg viewBox="0 0 100 100" class="'+(i<paws?"":"off")+'"><use href="#paw"/></svg>');
    var msgs=["Que faro! Nem a Juma nem o Bart precisaram ajudar.","Bom trabalho! Só um ossinho gasto.","Conseguiu! Na próxima tenta com menos ossinhos."];
    var s=streak();$("winMsg").textContent=G.mode==="daily"?"Volte amanhã para um quintal novo. Sequência: "+s+(s===1?" dia":" dias")+".":msgs[3-paws];
    $("nextBtn").hidden=G.mode==="daily";$("winOv").hidden=false},1100)}
$("nextBtn").onclick=function(){$("winOv").hidden=true;startGame(G.game,"level",store.m[G.game].level)};
$("homeBtn").onclick=function(){$("winOv").hidden=true;showView("home")};

/* Como jogar */
function openHow(){var E=eng();$("howTitle").textContent=E.name;$("howBody").innerHTML=E.how;$("howOv").hidden=false;if(G&&!G.won&&G.startAt){G.elapsed=elapsed();G.startAt=null}}
$("howClose").onclick=function(){$("howOv").hidden=true;store.how[G.game]=true;save();if(G&&!G.won&&!G.startAt)G.startAt=performance.now()};
$("helpBtn").onclick=openHow;
document.addEventListener("keydown",function(e){if(!G||G.won||$("game").hidden||!$("howOv").hidden||!$("winOv").hidden)return;var E=eng();if(!E.key)return;
  var dir={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(dir!==undefined){e.preventDefault();E.key(dir)}else if(e.key===" "){e.preventDefault();E.key("swap")}});

/* =====================================================================
   INÍCIO
   ===================================================================== */
function buildHome(){var box=$("mods");box.innerHTML="";
  Object.keys(ENG).forEach(function(g){var E=ENG[g],m=store.m[g],lv=m.level,n=E.sizeFor?E.sizeFor(lv):sizeFor(lv),resuming=store.current[g]&&store.current[g].key==="l"+lv,d=m.daily[todayKey()];
    var el=document.createElement("div");el.className="mod";
    el.innerHTML='<div class="modhead"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#ico-'+g+'"/></svg><div><h2>'+E.name+'</h2><p>'+E.desc+'</p></div></div>'+
      '<div class="modbtns"><button class="btn primary" data-act="play"><span class="lbl"><span>'+(resuming?"Continuar ":"Nível ")+lv+'</span><small>'+n+'×'+n+' · '+(E.diff?E.diff(n):diffName(n))+'</small></span></button>'+
      '<button class="btn soft" data-act="daily"><span class="lbl"><span class="'+(d?"done":"")+'">'+(d?"Dia ✓":"Desafio do dia")+'</span><small>'+(d?"Feito em "+fmt(d.time):E.dailySize+"×"+E.dailySize+" · todo mundo igual")+'</small></span></button></div>';
    el.querySelector('[data-act="play"]').onclick=function(){startGame(g,"level",store.m[g].level)};
    el.querySelector('[data-act="daily"]').onclick=function(){startGame(g,"daily",0)};
    box.appendChild(el)});
  var lv=0;Object.keys(store.m).forEach(function(g){lv+=Object.keys(store.m[g].done).length});
  $("statLevels").textContent=lv;$("statStreak").textContent=streak();$("statPaws").textContent=pawsTotal()}
function showView(v){$("home").hidden=v!=="home";$("game").hidden=v!=="game";if(v==="home")buildHome()}
$("backBtn").onclick=function(){if(G&&!G.won){G.elapsed=elapsed();G.startAt=null;persistCurrent()}showView("home")};
function paintSound(){$("soundWaves").style.opacity=store.sound?1:.15;$("soundBtn").setAttribute("aria-label",store.sound?"Desligar som":"Ligar som")}
$("soundBtn").onclick=function(){store.sound=!store.sound;save();paintSound();sfx("dog")};
document.addEventListener("visibilitychange",function(){if(!G||G.won||$("game").hidden||!$("howOv").hidden)return;if(document.hidden){G.elapsed=elapsed();G.startAt=null;persistCurrent()}else G.startAt=performance.now()});

/* Boot (com suporte a atualização ao vivo) */
function start(data){
  if(data&&data.store&&data.store.m){store=data.store;ensureModes()}
  paintSound();
  if(data&&data.view==="game"&&data.game&&ENG[data.game])startGame(data.game,data.mode,data.level);else showView("home");
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){persistCurrent();return{store:store,view:$("game").hidden?"home":"game",game:G&&G.game,mode:G&&G.mode,level:G&&G.level}});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
